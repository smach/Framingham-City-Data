# Once a week, looks for new election results on the City Clerk's page. When
# it finds some, it opens a GitHub issue listing them, with the add_election()
# line to run after you convert each PDF in Adobe Acrobat. It changes nothing
# in the repository, and it doesn't open a second issue while one is still open.
#
# No setup needed: it uses the repository's built-in GITHUB_TOKEN.
name: Check for new election results

on:
  schedule:
    - cron: "17 12 * * 3"       # every Wednesday, 12:17 UTC (8:17 a.m. EDT)
  workflow_dispatch:             # "Run workflow" button on the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Look for new results
        run: Rscript scripts/check_new_elections.R

      - name: Open an issue if anything was found
        if: hashFiles('issue_body.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "New election results to convert"
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "An issue titled '$TITLE' is already open; not opening another."
          else
            gh issue create --title "$TITLE" --body-file issue_body.md
          fi
