# Runs on every pull request (and push to main):
#   1. rebuilds data/elections/ and fails if any validation check fails
#   2. fails if the rebuilt files differ from the committed ones -- meaning
#      someone changed code or raw data without re-running the build
#   3. runs the tests in tests/testthat/
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Rebuild election data (fails if a validation check fails)
        run: Rscript scripts/build_all.R

      - name: Check committed data matches the code
        run: |
          if ! git diff --quiet -- data/elections; then
            echo "::error::data/elections/ is out of date. Run 'Rscript scripts/build_all.R' and commit the result."
            git diff --stat -- data/elections
            exit 1
          fi

      - name: Run tests
        run: Rscript tests/testthat.R
