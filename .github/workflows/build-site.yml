# Rebuilds the project website with Quarto whenever data, code or the page
# source changes on main, and commits the result to docs/. GitHub Pages keeps
# serving the site from the docs/ folder, so no settings change is needed.
name: Build website

on:
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "_quarto.yml"
      - "data/**"
      - "data-raw/**"
      - "R/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown

      - name: Render the site
        run: quarto render

      # A push made with the built-in GITHUB_TOKEN doesn't start other
      # workflows, so this can't loop.
      - name: Commit the rendered site if it changed
        run: |
          git add docs
          if ! git diff --cached --quiet -- docs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild website"
            git push
          fi
