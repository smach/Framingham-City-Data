# Rebuilds the project website (docs/index.html) whenever data, code or the
# page source changes on main, and commits the result. GitHub Pages keeps
# serving the site from the docs/ folder, so no settings change is needed.
name: Build website

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "data-raw/**"
      - "docs/index.Rmd"
      - "docs/catalog_descriptions.csv"
      - "R/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render the site
        run: Rscript -e 'rmarkdown::render("docs/index.Rmd")'

      # A push made with the built-in GITHUB_TOKEN doesn't start other
      # workflows, so this can't loop.
      - name: Commit the rendered page if it changed
        run: |
          if ! git diff --quiet -- docs/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Rebuild website"
            git push
          fi
